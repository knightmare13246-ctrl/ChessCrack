AutoName: ChessCrack
Summary: Offline UCI chess engine & neural network analysis workbench
Description: |-
  ChessCrack is an offline UCI chess engine analysis workbench and neural
  network study utility designed for players, coaches, and researchers.

  Key Features:
  * Modular on-demand UCI engine management (Stockfish 19, Leela Chess Zero).
  * Human-style sparring and training policy evaluation with Maia neural networks.
  * Real-time Multi-PV line calculation, WDL win/draw/loss probability distribution, and live eval bar.
  * Interactive candidate move arrows colored by engine preference.
  * Zero-binary base packaging: initial APK contains no bulky engine binaries; assets download on-demand into sandboxed storage.
  * Complete privacy: 100% offline analysis, zero trackers, zero advertisements, and minimal permissions.

